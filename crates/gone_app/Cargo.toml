[package]
name = "gone_app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The real Bevy app (issue #6 slice A). Minimal shipping feature set, justified in
# docs/dev/harness.md:
#   std, async_executor, multi_threaded, bevy_log
#   bevy_asset, bevy_state, reflect_auto_register  (default_app cluster)
#   bevy_winit (window + real-device input), bevy_window
#   bevy_render (render resources; no pipeline compile until PBR ships), bevy_camera,
#   bevy_color, bevy_core_pipeline (render graph the app needs)
#   png (capture write)
# Everything else (audio, bevy_gilrs/gamepad, bevy_sprite/ui, pbr/gltf, picking,
# bevy_material/bevy_mesh) stays off: the slice-A scene is empty and unlit, so no
# PBR material pipeline is compiled.
#
# The protocol types (scenario, report, input adapter, frame-code) live in THIS crate's
# public `harness` module; `gone_harness` re-exports them. The app reads the
# scenario JSON (serde), writes the JSON report (serde_json), and never depends on
# `gone_harness`. sha2 is not needed inside the app: the runner computes the content
# hashes and passes them in as environment, so this crate stays render-side.
[dependencies]
gone_sim = { path = "../gone_sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `image` crate behind bevy's `png` feature is re-exported as
# `bevy::image`'s dependency; we do not add it directly. The lane pixel buffer
# is written straight to disk via std + the image crate encoded in src by adding image
# only as a build-time helper is wrong — but writing PNG bytes by hand is not needed:
# we write the beat PNGs from the exact bytes we already have, and the runner decodes
# them with its own `image` dep. So no extra dependency here.
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_asset",
    "bevy_state",
    "reflect_auto_register",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "png",
]

[lints]
workspace = true
